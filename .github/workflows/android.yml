name: Android

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detekt:
    name: Detekt
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/android-check
        with:
          task: detekt
          report-name: reports-detekt

  lint:
    name: Android lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/android-check
        with:
          task: ciLint
          report-name: reports-lint

  unit-tests:
    name: Unit tests (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [Debug, Release]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/android-check
        with:
          task: ciUnitTest${{ matrix.variant }}
          report-name: reports-unit-tests-${{ matrix.variant }}

  build:
    name: Build (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: Debug
            artifact-variant: debug
          - variant: Release
            artifact-variant: release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/android-check
        with:
          task: ciAssemble${{ matrix.variant }}
          report-name: reports-build-${{ matrix.variant }}
          application-variant: ${{ matrix.artifact-variant }}

  instrumentation:
    name: Instrumentation APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - uses: ./.github/actions/android-check
        with:
          task: ciAssembleAndroidTest
          report-name: reports-instrumentation
          instrumentation-apks: 'true'

  repository-check:
    name: repository-check
    if: always()
    needs: [detekt, lint, unit-tests, build, instrumentation]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$JOB_RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$JOB_RESULTS" | jq -e 'all(.[]; .result == "success")'
