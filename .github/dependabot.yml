version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      kotlin:
        patterns: ['org.jetbrains.kotlin*']
      android-gradle:
        patterns: ['com.android*']
      androidx:
        patterns: ['androidx.*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
