config:
  validation: true

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']

naming:
  EnumNaming:
    enumEntryPattern: '[A-Z][A-Z0-9]*(_[A-Z0-9]+)*'
  FunctionNaming:
    ignoreAnnotated: ['Composable']

style:
  MagicNumber:
    ignorePropertyDeclaration: true
    ignoreAnnotated: ['Composable', 'Preview']
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']
