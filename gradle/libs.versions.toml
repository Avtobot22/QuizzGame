[versions]
agp = "9.3.3"
kotlin = "2.4.21"
composeBom = "2026.09.00"
activity = "1.13.0"
tvMaterial = "1.1.0"
detekt = "1.23.8"
androidxTestRunner = "1.7.0"
androidxTestJunit = "1.3.0"
kakaoCompose = "1.1.1"
espresso = "3.7.0"
#noinspection NewerVersionAvailable
okhttp = "5.5.1"
#noinspection NewerVersionAvailable
retrofit = "3.0.0"
#noinspection NewerVersionAvailable
serialization = "1.12.0"
junit = "4.13.2"
androidMock = "0.1.0-SNAPSHOT"
coroutines = "1.11.0"
lifecycle = "2.11.0"
datastore = "1.3.0"
tink = "1.24.0"
hilt = "2.60.1"
ksp = "2.3.13"
navigation3 = "1.2.1"
androidxHilt = "1.4.0"
androidxAnnotationExperimental = "1.6.0"

[libraries]
featureflags-core = { module = "local.featureflags:core" }
featureflags-json = { module = "local.featureflags:json" }
featureflags-android = { module = "local.featureflags:android" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
hilt-gradle-plugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
androidx-navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
androidx-hilt-lifecycle-viewmodel-compose = { module = "androidx.hilt:hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }
androidx-annotation-experimental = { module = "androidx.annotation:annotation-experimental", version.ref = "androidxAnnotationExperimental" }
tink-android = { module = "com.google.crypto.tink:tink-android", version.ref = "tink" }
androidx-datastore = { module = "androidx.datastore:datastore", version.ref = "datastore" }
androidx-datastore-tink = { module = "androidx.datastore:datastore-tink", version.ref = "datastore" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
kotlin-compose-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "lifecycle" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-tv-material = { module = "androidx.tv:tv-material", version.ref = "tvMaterial" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
kakao-compose = { module = "io.github.kakaocup:compose", version.ref = "kakaoCompose" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-kotlinx-serialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version.ref = "retrofit" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
junit = { module = "junit:junit", version.ref = "junit" }
androidmock-core = { module = "dev.androidmock:mock-core", version.ref = "androidMock" }
androidmock-okhttp-server = { module = "dev.androidmock:mock-okhttp-server", version.ref = "androidMock" }

[bundles]
build-plugins = [
    "android-gradle-plugin",
    "kotlin-gradle-plugin",
    "kotlin-compose-gradle-plugin",
    "hilt-gradle-plugin",
    "ksp-gradle-plugin",
]
compose-core = ["androidx-compose-foundation", "androidx-compose-ui"]
compose-ui-test = [
    "androidx-compose-ui-test-junit4",
    "androidx-activity-compose",
    "kakao-compose",
    "androidx-test-espresso-core",
]
android-test = ["androidx-test-junit", "androidx-test-runner"]
navigation3 = [
    "androidx-navigation3-runtime",
    "androidx-navigation3-ui",
    "androidx-lifecycle-viewmodel-navigation3",
]
android-mock = ["androidmock-core", "androidmock-okhttp-server"]
network-api = [
    "okhttp",
    "retrofit",
    "kotlinx-serialization-json",
]
network-test = ["kotlinx-coroutines-test", "okhttp-mockwebserver"]
unit-test = ["junit", "kotlinx-coroutines-test"]
secure-storage = [
    "androidx-datastore",
    "androidx-datastore-tink",
    "tink-android",
]

[plugins]
quizz-android-hilt = { id = "quizz.android.hilt" }
quizz-android-infrastructure-library = { id = "quizz.android.infrastructure.library" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
quizz-android-mobile-application = { id = "quizz.android.mobile.application" }
quizz-android-tv-application = { id = "quizz.android.tv.application" }
quizz-android-shared-library = { id = "quizz.android.shared.library" }
quizz-android-mobile-library = { id = "quizz.android.mobile.library" }
quizz-android-tv-library = { id = "quizz.android.tv.library" }
quizz-kotlin-jvm-library = { id = "quizz.kotlin.jvm.library" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
